name: Publish to Chrome Web Store

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout v7.0.1 (commit SHA で固定)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: バージョンを取得
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: pnpm セットアップ
        # pnpm/action-setup v6.0.10 (commit SHA で固定)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Node セットアップ
        # actions/setup-node v7.0.0 (commit SHA で固定)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール
        # lockfile 整合性を強制するため pnpm install --frozen-lockfile のみ。
        run: pnpm install --frozen-lockfile

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: テスト実行
        run: pnpm test

      - name: zip パッケージを作成
        run: |
          # manifest.json から key フィールドを除去 (key はローカル開発専用、ストアアップロード時は不要)
          BUILD_DIR=$(mktemp -d)
          node -e "const m=require('./manifest.json');delete m.key;require('fs').writeFileSync('$BUILD_DIR/manifest.json',JSON.stringify(m,null,2))"
          mkdir -p "$BUILD_DIR/icons"
          cp icons/icon-16.png icons/icon-48.png icons/icon-128.png "$BUILD_DIR/icons/"
          cp popup.html "$BUILD_DIR/"
          cp -r _locales src "$BUILD_DIR/"
          (cd "$BUILD_DIR" && zip -r "$OLDPWD/clean-start.zip" . -x "*.DS_Store" "*.swp" "*~")
          rm -rf "$BUILD_DIR"
          ls -lh clean-start.zip

      - name: Chrome Web Store にアップロード & 公開
        # chrome-webstore-upload-cli はローカル devDep にインストール済 (package.json で固定)。
        # secrets を持つステップでレジストリから未検証コードを取得しない方針のため
        # `pnpm exec` を指定し、node_modules 内のローカル版だけを呼ぶ (無ければ失敗する)。
        # v4 以降は --client-id 等の CLI フラグが廃止され、環境変数 (CLIENT_ID 等) が必須。
        # PUBLISHER_ID も新規必須項目。コマンド (upload/publish) を省略すると
        # upload → publish の両方が自動実行される (旧 --auto-publish 相当)。
        # バイナリ名は `chrome-webstore-upload` (npm パッケージ名 chrome-webstore-upload-cli とは別名)。
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          # 同 version 再 push（release ブランチ再 push 等）では既にアップロード/審査中で
          # cli が exit 1 になる。これは無害な重複なので warning 化して CI を green に保つ。
          set +e
          pnpm exec chrome-webstore-upload \
            --source clean-start.zip 2>&1 | tee /tmp/cws.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
          if grep -qiE "ITEM_NOT_UPDATABLE|pending review|ready to publish|cannot be updated|already (published|exists|uploaded)|currently in review|item that is in review|in_review|version already|DUPLICATE_VERSION" /tmp/cws.log; then
              echo "::warning::Chrome Web Store に同 version が既にアップロード/公開済み。CI green 化のため exit 0 扱いに変換します"
            else
              echo "::error::chrome-webstore-upload が同 version 重複以外の理由で失敗しました (rc=$rc)。ログ確認要"
              exit "$rc"
            fi
          fi
          echo "🎉 Chrome Web Store への公開リクエストを送信したよ〜"
