name: Publish to Chrome Web Store
# CWS は「アップロード」と「審査への申請」を別 workflow に分けている。
# この workflow は検証済みZIPを下書きとしてアップロードするだけで、申請しない。
# 申請は掲載画像などを Dashboard で整えた後に、cws-submit.yml を手動で実行する。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # push の run が出なかったときの再実行専用。一部 job の失敗は `gh run rerun <id> --failed` を使う。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Chrome Web Store アップロード（申請は cws-submit.yml）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: バージョンを取得
        id: version
        run: |
          # Bun の準備はこの後の工程。ここで bun を呼ぶと command not found になるため grep で取り出す。
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: タグと manifest バージョンの整合性を確認
        # タグ（厳密な v<x.y.z>・軽量タグがこの commit を指す・既定ブランチの祖先）と manifest の版の一致を、無条件に確認する。
        # Secrets を使う step より前に置く。
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$MANIFEST_VERSION"
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::タグ以外では配信しません: $GITHUB_REF"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::版タグ v<x.y.z> の形ではありません: $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit id が不正です"; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::タグ ($GITHUB_REF_NAME) と manifest.json の版 ($version) が一致しません。期待値: v$version"; exit 1; }
          # 軽量タグで、いまもこの commit を指すこと（注釈付きタグ・付け替え済みのタグを拒否する）。
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')" == "commit $GITHUB_SHA" ]] \
            || { echo "::error::タグ $GITHUB_REF_NAME が $GITHUB_SHA を指す軽量タグではありません"; exit 1; }
          # 既定ブランチの祖先であること（depth=1 の checkout では判定できないので compare API を使う）。
          default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          [[ "$default" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::既定ブランチ名が不正です"; exit 1; }
          cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default?per_page=1" --jq '.status + " " + (.behind_by | tostring)')"
          [[ "$cmp" == "ahead 0" || "$cmp" == "identical 0" ]] || { echo "::error::$default の祖先ではありません ($cmp)"; exit 1; }
          echo "✅ 配信対象: $GITHUB_REF_NAME ($GITHUB_SHA)"

      - name: Prepare native Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile 'package.json'

      - name: 依存インストール
        # lockfile 整合性を強制するため bun run deps のみ。
        run: bun run deps

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: テスト実行
        run: bun --bun run test

      - name: zip パッケージを作成
        run: |
          # manifest.json から key フィールドを除去 (key はローカル開発専用、ストアアップロード時は不要)
          BUILD_DIR=$(mktemp -d)
          bun -e "const m=require('./manifest.json');delete m.key;require('fs').writeFileSync('$BUILD_DIR/manifest.json',JSON.stringify(m,null,2))"
          mkdir -p "$BUILD_DIR/icons"
          cp icons/icon-16.png icons/icon-48.png icons/icon-128.png "$BUILD_DIR/icons/"
          cp popup.html "$BUILD_DIR/"
          cp -r _locales src "$BUILD_DIR/"
          (cd "$BUILD_DIR" && zip -r "$OLDPWD/clean-start.zip" . -x "*.DS_Store" "*.swp" "*~")
          rm -rf "$BUILD_DIR"
          ls -lh clean-start.zip

      - name: Chrome Web Store にアップロード（下書き）
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "clean-start.zip" -Stage Upload
